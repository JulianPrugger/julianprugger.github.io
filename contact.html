<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kontakt – Julian Prugger</title>

  <style>
    body {
      font-family: Georgia, "Times New Roman", serif;
      max-width: 900px;
      margin: 0 auto;
      padding: 0 24px;
      line-height: 1.7;
      color: #0f1f1d;
      background: #f6fbf9;
    }

    h1 {
      font-size: 2em;
      font-weight: normal;
      margin-top: 1em;
      margin-bottom: 0.5em;
    }

    p {
      margin-bottom: 1em;
    }

    /* Formular */
    .contact-page-form {
      margin-top: 1.5em;
      padding: 1.5em;
      background-color: #ffffff;
      border: 1px solid #cbd8d2;
      border-radius: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }

    .contact-page-form label {
      display: block;
      margin-bottom: 0.3em;
      font-weight: bold;
      color: #3e5f5a;
    }

    .contact-page-form input,
    .contact-page-form textarea {
      width: 100%;
      padding: 0.5em;
      margin-bottom: 0.8em;
      border: 1px solid #cbd8d2;
      border-radius: 6px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1em;
      color: #0f1f1d;
      background-color: #f6fbf9;
    }

    .contact-page-form input:focus,
    .contact-page-form textarea:focus {
      outline: none;
      border-color: #3e5f5a;
      background-color: #ffffff;
    }

    .contact-page-form button {
      background-color: #3e5f5a;
      color: #ffffff;
      border: none;
      padding: 0.6em 1.2em;
      font-size: 1em;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .contact-page-form button:hover {
      background-color: #2f4c44;
    }

    footer {
      margin-top: 3em;
      font-size: 0.9em;
      color: #3e5f5a;
    }

    /* ✨ Footer-Links wie auf index.html */
    footer a {
      color: #1f3f3a;
      text-decoration: none;
      border-bottom: 1px solid #9bbab4;
      padding-bottom: 2px;
      transition: border-color 0.2s;
    }

    footer a:hover {
      border-bottom: 1px solid #1f3f3a;
    }
  </style>
</head>
<body>

  <!-- Navigation laden -->
  <div id="nav-container"></div>
  <script>
    fetch('nav.html')
      .then(response => response.text())
      .then(data => {
        document.getElementById('nav-container').innerHTML = data;
      })
      .catch(err => console.error('Fehler beim Laden der Navigation:', err));
  </script>

  <!-- Inhalt -->
  <h1>Kontakt</h1>
  <p>Ich freue mich über Anfragen zu Forschung, Vorträgen, Workshops oder anderen Kooperationen.</p>

  <!-- Formular -->
  <form class="contact-page-form" action="https://formspree.io/f/mwvwkkyj" method="POST">
    <input type="text" name="_gotcha" style="display:none">
    <input type="hidden" name="_redirect" value="danke.html">
    <input type="hidden" name="_subject" value="Neue Kontaktanfrage">

    <label for="name">Name:</label>
    <input type="text" id="name" name="name" required>

    <label for="email">E-Mail:</label>
    <input type="email" id="email" name="email" required>

    <label for="message">Nachricht:</label>
    <textarea id="message" name="message" rows="5" required></textarea>

    <button type="submit">Absenden</button>
  </form>

  <footer>
    <a href="impressum.html">Impressum</a> |
    <a href="datenschutz.html">Datenschutz</a>
  </footer>

</body>
</html>
