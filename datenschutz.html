<!-- Navigation-Snippet für alle Unterseiten -->
<div id="nav-container"></div>

<style>
  /* Navigation oben */
  .top-nav {
    position: sticky;
    top: 0;
    background-color: #f6fbf9;
    border-bottom: 1px solid #cbd8d2;
    padding: 0.6em 24px;
    z-index: 100;
    font-family: Georgia, "Times New Roman", serif;
    margin-bottom: 1em;
  }

  .top-nav ul {
    display: flex;           /* horizontal */
    flex-wrap: wrap;
    gap: 1.2em;
    margin: 0;
    padding: 0;
    list-style: none;
    font-size: 0.95em;
  }

  .top-nav a {
    color: #1f3f3a;
    text-decoration: none;
    border-bottom: 1px solid transparent;
    transition: border-color 0.2s;
  }

  .top-nav a:hover {
    border-bottom: 1px solid #1f3f3a;
  }

  @media (max-width: 700px) {
    .top-nav ul {
      flex-direction: column;
      gap: 0.6em;
    }
  }
</style>

<script>
  fetch('nav.html')
    .then(response => response.text())
    .then(data => {
      const container = document.getElementById('nav-container');
      container.innerHTML = data;

      // Kontakt-Link für das Formular aktivieren
      const contactLinkNav = container.querySelector('#contact-link-nav');
      const contactForm = container.querySelector('#contact-form');
      if(contactLinkNav && contactForm){
        contactLinkNav.addEventListener('click', function(e){
          e.preventDefault();
          contactForm.style.display = (contactForm.style.display === 'none' || contactForm.style.display === '') ? 'block' : 'none';
          if(contactForm.style.display === 'block'){
            contactForm.scrollIntoView({ behavior: 'smooth', block: 'start' });
          }
        });
      }
    })
    .catch(err => console.error('Fehler beim Laden der Navigation:', err));
</script>
